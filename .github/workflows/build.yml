
name: Build Crossed Signals DS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Compile Nintendo DS ROM
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104

    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Compile ROM
        run: make

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: crossed-signals-nds
          path: crossed-signals.nds
          if-no-files-found: error
